name: Full-Spectrum Post-Quantum Reality Gates & Invariant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  reality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: qmoosa-pqc-hybrid-tls-tests

      - name: Checkout protocol repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-hybrid-tls-protocol
          ref: f2e2a73688849190ee231bf887a2dbcc29324eda
          path: qmoosa-pqc-hybrid-tls-protocol

      - name: Checkout engine repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-hybrid-tls-engine
          ref: 093edcb6fa9d31e7aacaa75901a802686ab52ccc
          path: qmoosa-pqc-hybrid-tls-engine

      - name: Checkout sdk repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-hybrid-tls-sdk
          ref: 97a11a9e128a50bc52815716c80501f65f24e419
          path: qmoosa-pqc-hybrid-tls-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies in sibling repositories
        run: |
          npm install --prefix qmoosa-pqc-hybrid-tls-protocol
          npm install --prefix qmoosa-pqc-hybrid-tls-engine
          npm install --prefix qmoosa-pqc-hybrid-tls-sdk

      - name: Install dependencies in tests repository
        working-directory: qmoosa-pqc-hybrid-tls-tests
        run: |
          rm -f package-lock.json
          npm install --no-package-lock
          mkdir -p node_modules/@qmoosa/pqc-hybrid-tls-protocol
          mkdir -p node_modules/@qmoosa/pqc-hybrid-tls-engine
          mkdir -p node_modules/@qmoosa/pqc-hybrid-tls-sdk
          tar -xzf packages/qmoosa-pqc-hybrid-tls-protocol-1.0.0.tgz -C node_modules/@qmoosa/pqc-hybrid-tls-protocol --strip-components=1
          tar -xzf packages/qmoosa-pqc-hybrid-tls-engine-1.0.0.tgz -C node_modules/@qmoosa/pqc-hybrid-tls-engine --strip-components=1
          tar -xzf packages/qmoosa-pqc-hybrid-tls-sdk-1.0.0.tgz -C node_modules/@qmoosa/pqc-hybrid-tls-sdk --strip-components=1

      - name: Run Source & Package Integrity Gate (Archive Mode)
        working-directory: qmoosa-pqc-hybrid-tls-tests
        run: npm run verify:archive

      - name: Run Strict Current-HEAD Alignment Gate
        working-directory: qmoosa-pqc-hybrid-tls-tests
        run: npm run verify:current-head

      - name: Run Hermetic Source Derivation & Canonical Artifact Comparison Gate
        working-directory: qmoosa-pqc-hybrid-tls-tests
        run: npm run verify:source

      - name: Run Integration Tests
        working-directory: qmoosa-pqc-hybrid-tls-tests
        run: npm run test:integration

      - name: Run Adversarial Negative Control Suite
        working-directory: qmoosa-pqc-hybrid-tls-tests
        run: npm run test:negative

      - name: Static Lint Check
        working-directory: qmoosa-pqc-hybrid-tls-tests
        run: npm run lint
